# Build settings (command, Next.js runtime) come from the Netlify UI; this file only tunes secrets scanning.
#
# NEXT_PUBLIC_* values (and ADS_TXT, served at /ads.txt) are public by design: Next.js inlines them into the page and bundle, so Netlify's
# secrets scanner would fail every build that sets one. They are listed here so the scan skips them.
# Server-only secrets (SUBMISSION_WEBHOOK_URL, UPSTASH_REDIS_REST_TOKEN, ...) are NOT listed and stay scanned.
# When you add a new public variable to .env.example, add it here too.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION,NEXT_PUBLIC_AFF_PSN_URL,NEXT_PUBLIC_AFF_XBOX_URL,NEXT_PUBLIC_AFF_SSD_URL,NEXT_PUBLIC_AFF_DUALSENSE_URL,NEXT_PUBLIC_AFF_XBOX_STORAGE_URL,NEXT_PUBLIC_ADSENSE_CLIENT,NEXT_PUBLIC_ADSENSE_SLOT,NEXT_PUBLIC_PLAUSIBLE_DOMAIN,NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL,NEXT_PUBLIC_UMAMI_SCRIPT_URL,NEXT_PUBLIC_UMAMI_WEBSITE_ID,ADS_TXT"
