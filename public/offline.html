<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A1C">
<meta name="robots" content="noindex">
<title>Offline · Leonida Companion</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    background: radial-gradient(ellipse 90% 520px at 50% 0%, #1b1740 0%, transparent 100%) no-repeat, #0b0a1c;
    color: #fff; font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #ff4fa3, #8a4dff 55%, #ff9a3c); }
  h1 { margin: 24px 0 8px; color: #ff9ccb; font-weight: 500; font-size: clamp(2.5rem, 2.1rem + 1.2vw, 3rem); line-height: 1.15; }
  p { margin: 0 0 24px; color: #b9b5d6; font-size: 17px; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 22px; border-radius: 999px;
      background: #ff9ccb; color: #0b0a1c; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid #ff9ccb; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>You&rsquo;re Offline</h1>
  <p>This page isn&rsquo;t saved on your device yet. Reconnect to load the latest cheats and songs. Pages you opened recently may still work.</p>
  <a href="/">Try Again</a>
</main>
</body>
</html>
